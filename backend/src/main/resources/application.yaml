spring:
  application:
    name: route-planner
  datasource:
    # Defaults suit Postgres.app on a Mac, where the login role is your own username and
    # there is no password. Override with DB_NAME, DB_USERNAME and DB_PASSWORD anywhere else.
    url: jdbc:postgresql://localhost:5432/${DB_NAME:routeplanner}
    username: ${DB_USERNAME:${USER:postgres}}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the mapping matches it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

routeplanner:
  routing:
    # haversine: straight lines, no setup. graphhopper: real driving distances, needs the map extract.
    provider: haversine
    osm-file: data/new-zealand-latest.osm.pbf
    graph-cache: data/graph-cache
    profile: car
  addresses:
    # Set to true once, with the LINZ export in place, to load the address table.
    import-enabled: false
    csv: data/lds-nz-addresses-CSV/nz-addresses.csv
  poi:
    # Set to true with the Overture export in place to load named places. Safe to repeat
    # after every new export: it updates, adds and removes to match the file.
    import-enabled: false
    csv: data/overture-nz-places.csv
  search:
    # Overture scores each place from 0 to 1 for how likely it is to exist. Places below this
    # are left out of results. Raise it for fewer doubtful places, lower it for more small ones.
    min-confidence: 0.3
    # The most matches from each table that one search ranks. Keeps "road" from scoring
    # 850,000 addresses on every keystroke.
    candidate-limit: 5000
